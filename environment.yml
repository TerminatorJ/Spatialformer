name: spatialformer
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # ——— Core scientific stack ———
      - numpy>=1.24,<3
      - pandas>=2.0
      - scipy>=1.10
      - scikit-learn>=1.3
      - statsmodels>=0.14
      - numba>=0.56

      # ——— PyTorch (install WITHOUT +rocm/+cu suffix for portability) detail much check our README.md file ———

      # ——— Hugging Face / Transformers ———
      - transformers>=4.40
      - peft>=0.8
      - accelerate>=1.0
      - datasets>=4.0
      - safetensors>=0.4
      - tokenizers>=0.20

      # ——— Single-cell / spatial ———
      - scanpy>=1.9
      - anndata>=0.10
      - umap-learn>=0.5
      - python-louvain>=0.16

      # ——— Graphs & neighbors ———
      - faiss-cpu>=1.7
      - networkx>=3.0
      - communities>=3.0
      - pynndescent>=0.5

      # ——— Visualization ———
      - matplotlib>=3.7
      - seaborn>=0.13

      # ——— Utilities ———
      - einops>=0.7
      - h5py>=3.10
      - tqdm>=4.60
      - gdown>=5.0
      - wandb>=0.14
      - pyyaml>=6.0

      # ——— Your package ———
      - spatialformer>=0.1.8